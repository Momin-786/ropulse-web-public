version: 2.1

jobs:
  verify:
    docker:
      - image: cimg/node:22.18
    environment:
      NEXT_TELEMETRY_DISABLED: '1'
      DOCS_REVIEW_MODE: 'false'
      SITE_INDEXABLE: 'false'
      PLAYWRIGHT_CHANNEL: chromium
      TEST_PRODUCTION: 'true'
    steps:
      - checkout
      - restore_cache:
          keys:
            - public-web-npm-v1-{{ checksum "package-lock.json" }}
            - public-web-npm-v1-
      - run: npm ci
      - save_cache:
          key: public-web-npm-v1-{{ checksum "package-lock.json" }}
          paths:
            - ~/.npm
      - run: npm run check:security
      - run: npm audit --omit=dev
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

workflows:
  verify:
    jobs:
      - verify
